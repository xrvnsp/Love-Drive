name: Build LoveDrive APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: love-drive-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build Debug APK
        run: gradle assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LoveDrive-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Publish Direct APK to Latest Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk LoveDrive-debug.apk
          gh release upload latest LoveDrive-debug.apk --clobber ||           gh release create latest LoveDrive-debug.apk             --target "${{ github.sha }}"             --title "Love Drive Latest APK"             --notes "Automated build #${{ github.run_number }}"
