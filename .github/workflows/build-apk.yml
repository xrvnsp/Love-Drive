name: Build LoveDrive APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build Debug APK
        run: gradle assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LoveDrive-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Publish Direct APK to Latest Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk LoveDrive-debug.apk
          if ! gh release view latest >/dev/null 2>&1; then
            gh release create latest --title "Love Drive Latest APK" --notes "Automated Android Auto APK builds"
          fi
          gh release upload latest LoveDrive-debug.apk --clobber
